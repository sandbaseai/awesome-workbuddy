name: Label discovery audits

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  label:
    if: startsWith(github.event.issue.title, 'Discovery')
    runs-on: ubuntu-latest
    steps:
      - name: Apply audit label
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label audit
      - name: Validate visible Markdown structure
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const valid = body.startsWith('Candidate\n\n- Repository:')
              && body.includes('\n## Audit result\n\n')
              && body.includes('\n## Decision\n\n')
              && !body.includes('\\n');
            if (!valid) {
              core.setFailed('Audit issue must use real Markdown newlines and the Candidate / Audit result / Decision structure.');
            }
