name: Label discovery audits

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  label:
    if: startsWith(github.event.issue.title, 'Discovery')
    runs-on: ubuntu-latest
    steps:
      - name: Apply audit label
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label audit
