name: Update ecosystem

on:
  push:
    branches: [main]
    paths:
      - data/ecosystem-repos.txt
      - skills/*/SKILL.md
  schedule:
    - cron: "31 3 * * 1"
  workflow_dispatch:

concurrency:
  group: update-ecosystem-main
  # A newer authoritative push makes an older refresh stale. Cancel it instead
  # of letting it publish an intermediate snapshot after rapid curation merges.
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Synchronize latest main
        run: git pull --ff-only origin main
      - name: Refresh repository metadata
        run: |
          python scripts/update_ecosystem.py
          python scripts/discover_repos.py
          python scripts/update_readme_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No ecosystem changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ECOSYSTEM.md DISCOVERIES.md README.md README.en.md
          git commit -m "chore: refresh ecosystem metrics"
          git push
      - name: Publish discovery queue as an issue
        run: |
          issue_number="$(gh issue list --label discovery --state open --json number --jq '.[0].number')"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --title "Weekly WorkBuddy ecosystem discovery queue" --body-file DISCOVERIES.md
          else
            gh issue create --title "Weekly WorkBuddy ecosystem discovery queue" --label discovery --body-file DISCOVERIES.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
