name: 报告失效或不安全链接 / Report a broken or unsafe link
description: 报告无法访问、内容迁移或存在安全风险的资源 / Report an unavailable, moved, or risky resource
title: "[Link]: "
labels: [broken-link]
body:
  - type: input
    id: url
    attributes:
      label: 资源链接 / Resource URL
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述 / Problem description
      description: 请说明错误状态、迁移地址或具体风险，以及检查日期。 / Include the error, replacement URL, or specific risk, plus the date checked.
    validations:
      required: true
