name: 报告失效或不安全链接
description: 报告无法访问、内容迁移或存在安全风险的资源
title: "[Link]: "
labels: [broken-link]
body:
  - type: input
    id: url
    attributes:
      label: 资源链接
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 请说明错误状态、迁移地址或具体风险，以及检查日期。
    validations:
      required: true
