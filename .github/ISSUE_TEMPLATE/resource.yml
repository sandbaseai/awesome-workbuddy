name: 推荐资源 / Suggest a resource
description: 推荐一个经过验证的 WorkBuddy 资源 / Suggest a verified WorkBuddy resource
title: "[Resource]: "
labels: [resource]
body:
  - type: input
    id: url
    attributes:
      label: 资源链接 / Resource URL
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: 为什么值得收录？ / Why should it be included?
      description: 请说明内容、适用人群，以及你实际验证过的部分。 / Describe the content, audience, and what you actually verified.
    validations:
      required: true
  - type: dropdown
    id: relationship
    attributes:
      label: 你与该资源的关系 / Your relationship to the resource
      options:
        - 无关系 / None
        - 我是作者或维护者 / Author or maintainer
        - 存在商业关系 / Commercial relationship
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认 / Submission checks
      options:
        - label: 我已搜索 README，确认该资源尚未收录。 / I searched both READMEs and confirmed it is not listed.
          required: true
        - label: 我已检查链接可公开访问，且内容与腾讯 WorkBuddy 直接相关。 / I checked that it is public and directly relevant to Tencent WorkBuddy.
          required: true
