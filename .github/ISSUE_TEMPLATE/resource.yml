name: 推荐资源
description: 推荐一个经过验证的 WorkBuddy 资源
title: "[Resource]: "
labels: [resource]
body:
  - type: input
    id: url
    attributes:
      label: 资源链接
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: 为什么值得收录？
      description: 请说明内容、适用人群，以及你实际验证过的部分。
    validations:
      required: true
  - type: dropdown
    id: relationship
    attributes:
      label: 你与该资源的关系
      options:
        - 无关系
        - 我是作者或维护者
        - 存在商业关系
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索 README，确认该资源尚未收录。
          required: true
        - label: 我已检查链接可公开访问，且内容与腾讯 WorkBuddy 直接相关。
          required: true
